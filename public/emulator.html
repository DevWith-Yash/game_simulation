<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Emulator Host</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script type="text/javascript">
    // Extract query parameters from URL: ?core=nes&rom=/roms/mario.nes
    const params = new URLSearchParams(window.location.search);
    const core = params.get('core') || 'nes';
    const rom = params.get('rom') || '';

    // EmulatorJS Configuration Variables
    EJS_player = '#game';
    EJS_core = core; // e.g., 'nes', 'snes', 'n64'
    EJS_gameUrl = rom; // Path to the ROM file
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; // CDNs hosted emulator assets
  </script>
  
  <!-- EmulatorJS Script Loader -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
