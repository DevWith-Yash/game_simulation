<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Emulator Host</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game"></div>

<script type="text/javascript">
  const params = new URLSearchParams(window.location.search);
  const core = params.get('core') || 'nes';
  const rom = params.get('rom') || '';

  EJS_player = '#game';
  EJS_core = core;
  EJS_gameUrl = rom;
  EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  
  // Performance Fixes
  EJS_threads = true;              // Enable multi-threading / WebAssembly threads
  EJS_startOnLoaded = true;        // Skip unnecessary menu loads
  EJS_alignFrames = true;          // Force 60 FPS frame synchronization
</script>
  
  <!-- EmulatorJS Script Loader -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
