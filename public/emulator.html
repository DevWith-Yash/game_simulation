<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Emulator Host</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script type="text/javascript">
    const params = new URLSearchParams(window.location.search);
    const core = params.get('core') || 'nes';
    const rom = params.get('rom') || '';

    // EmulatorJS Configuration
    EJS_player = '#game';
    EJS_core = core;
    EJS_gameUrl = rom;
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    
    // Performance & Compatibility Settings
    EJS_threads = false;             // FIX: Disabled to prevent SharedArrayBuffer crash
    EJS_language = 'en-US';          // FIX: Prevents 404 lookup for en-GB localization
    EJS_startOnLoaded = true;        // Autostarts game when core downloads
    EJS_alignFrames = true;          // Maintains smooth 60 FPS
  </script>
  
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
